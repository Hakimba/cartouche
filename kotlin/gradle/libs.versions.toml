# Versions follow Godot 4.7.2's Android build template (app/android/build/config.gradle), which
# compiles the app that embeds this plugin: same Android Gradle Plugin, Kotlin and SDK levels.
[versions]
agp = "8.6.1"
kotlin = "2.1.21"
godot = "4.7.2.stable"
arrow = "2.1.2"            # built against Kotlin 2.1.21
coroutines = "1.10.2"      # built against Kotlin 2.1
serialization = "1.8.1"    # built against Kotlin 2.1.20
junit = "4.13.2"
kotest = "5.9.1"           # 6.x requires Kotlin 2.2
kotest-arrow = "2.0.0"
ktlint-gradle = "13.1.0"
robolectric = "4.16.1"

[libraries]
godot = { module = "org.godotengine:godot", version.ref = "godot" }
arrow-core = { module = "io.arrow-kt:arrow-core", version.ref = "arrow" }
arrow-serialization = { module = "io.arrow-kt:arrow-core-serialization", version.ref = "arrow" }
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
junit = { module = "junit:junit", version.ref = "junit" }
kotest-property = { module = "io.kotest:kotest-property", version.ref = "kotest" }
kotest-assertions = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotest-assertions-arrow = { module = "io.kotest.extensions:kotest-assertions-arrow", version.ref = "kotest-arrow" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }

[bundles]
test = ["junit", "kotest-property", "kotest-assertions", "kotest-assertions-arrow", "coroutines-core", "coroutines-test"]

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint-gradle" }
